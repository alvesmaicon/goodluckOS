odroidgoa-uboot-config

# goodluckOS on the R36H: the stock u-boot loads the kernel and the DTB from this FAT partition
setenv bootargs "root=/dev/mmcblk0p2 rootfstype=ext4 rootwait rw init=/sbin/init console=ttyS2,115200 console=tty0 coherent_pool=4m loglevel=8 panic=10"

# bring-up: both LED pins, 3 s each (gpio2 PB5 high then low, gpio0 PC1 high then low)
gpio set c13
sleep 3
gpio clear c13
sleep 3
gpio set a17
sleep 3
gpio clear a17

setenv loadaddr "0x02000000"
setenv dtb_loadaddr "0x01f00000"

load mmc 1:1 ${loadaddr} Image
load mmc 1:1 ${dtb_loadaddr} rk3326-gameconsole-r36h.dtb

booti ${loadaddr} - ${dtb_loadaddr}
sleep 3
reset
