odroidgoa-uboot-config

# goodluckOS on the R36H: the stock u-boot loads the kernel and the DTB from this FAT partition
setenv bootargs "root=/dev/mmcblk0p2 rootfstype=ext4 rootwait=20 rw init=/sbin/init console=ttyS2,115200 console=tty0 coherent_pool=4m loglevel=8 panic=10"

setenv loadaddr "0x02000000"
setenv dtb_loadaddr "0x01f00000"

# bring-up: the last boot's kernel log (ramoops in the DTS), then a file on this partition at each step
fatwrite mmc 1:1 0x0f000000 ramoops.bin 0x100000
fatwrite mmc 1:1 ${dtb_loadaddr} step1-bootini 0x10
gpio set c13
sleep 3
gpio clear c13
sleep 3
gpio set a17
sleep 3
gpio clear a17

load mmc 1:1 ${loadaddr} Image
fatwrite mmc 1:1 ${dtb_loadaddr} step2-image 0x10
load mmc 1:1 ${dtb_loadaddr} rk3326-gameconsole-r36h.dtb
env export -t 0x01100000
fatwrite mmc 1:1 0x01100000 step3-env.txt ${filesize}

booti ${loadaddr} - ${dtb_loadaddr}
fatwrite mmc 1:1 ${dtb_loadaddr} step4-booti-failed 0x10
sleep 3
reset
