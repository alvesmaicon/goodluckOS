odroidgoa-uboot-config

# goodluckOS on the R36H through the stock u-boot, which draws BOOT/logo.bmp and then runs this.
# The kernel's messages go to the screen until S00silent clears it, with no kernel logo on top.
setenv loadaddr "0x02000000"
setenv dtb_loadaddr "0x01f00000"
setenv bootargs "root=/dev/mmcblk0p2 rootfstype=ext4 rootwait rw init=/sbin/init console=tty0 console=ttyS2,1500000 logo.nologo vt.global_cursor_default=0 coherent_pool=4m loglevel=7 panic=10"

load mmc 1:1 ${loadaddr} gl/Image
load mmc 1:1 ${dtb_loadaddr} gl/rk3326-gameconsole-r36h.dtb
booti ${loadaddr} - ${dtb_loadaddr}
# a boot that fails: try again
sleep 3
reset
