odroidgoa-uboot-config

# goodluckOS on the R36H with the stock loaders: their u-boot draws BOOT/logo.bmp, then runs this
setenv bootargs "root=/dev/mmcblk0p2 rootfstype=ext4 rootwait rw init=/sbin/init console=ttyS2,1500000 fbcon=logo-count:1 fbcon=logo-pos:center vt.global_cursor_default=0 coherent_pool=4m loglevel=8 panic=10"

load mmc 1:1 0x02000000 Image
load mmc 1:1 0x01f00000 rk3326-gameconsole-r36h.dtb
booti 0x02000000 - 0x01f00000
