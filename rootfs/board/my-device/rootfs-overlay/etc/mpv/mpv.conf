# goodluckOS: full screen on the console's display, gamepad controls in input.conf
vo=gpu,drm
gpu-context=drm
drm-device=/dev/dri/card1
opengl-es=yes
profile=fast
hwdec=no
vd-lavc-fast=yes
vd-lavc-skiploopfilter=nonref
ao=alsa
demuxer-max-bytes=16MiB
demuxer-max-back-bytes=4MiB

input-gamepad=yes
input-default-bindings=no
input-terminal=no
terminal=no
screenshot-directory=/tmp

# a single file plays with the rest of its folder (L1/R1); a folder plays whole
autocreate-playlist=same
directory-filter-types=video,audio
cover-art-auto=fuzzy
force-window=immediate
keep-open=no

osd-font-provider=none
sub-font-provider=none
osd-font-size=40
osd-bar-h=2.5
osd-duration=2000

[music]
osd-level=3
osd-align-y=bottom
osd-status-msg=${?metadata/by-key/Artist:${metadata/by-key/Artist}\n}${media-title}\n${time-pos} / ${duration}   ${?pause==yes:(paused)   }${playlist-pos-1}/${playlist-count}

[extension.mp3]
profile=music
[extension.flac]
profile=music
[extension.ogg]
profile=music
[extension.opus]
profile=music
[extension.m4a]
profile=music
[extension.aac]
profile=music
[extension.wav]
profile=music
[extension.wma]
profile=music
