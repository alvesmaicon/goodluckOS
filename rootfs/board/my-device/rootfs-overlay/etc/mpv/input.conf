# Console buttons (SDL gamepad names). START + SELECT closes mpv like any app.
GAMEPAD_ACTION_DOWN     cycle pause; show-progress
GAMEPAD_START           cycle pause; show-progress
GAMEPAD_ACTION_RIGHT    quit
GAMEPAD_ACTION_LEFT     show-text ${playlist} 4000
GAMEPAD_ACTION_UP       cycle-values loop-playlist inf no; show-text "Repeat: ${loop-playlist}"
GAMEPAD_DPAD_LEFT       seek -10
GAMEPAD_DPAD_RIGHT      seek 10
GAMEPAD_DPAD_UP         seek 60
GAMEPAD_DPAD_DOWN       seek -60
GAMEPAD_LEFT_STICK_LEFT  seek -10
GAMEPAD_LEFT_STICK_RIGHT seek 10
GAMEPAD_LEFT_SHOULDER   playlist-prev
GAMEPAD_RIGHT_SHOULDER  playlist-next
GAMEPAD_LEFT_TRIGGER    cycle audio
GAMEPAD_RIGHT_TRIGGER   cycle sub

# Speed and zoom stop at the ends: cycle-values steps from the first match, so the last value repeats
GAMEPAD_LEFT_STICK_UP    cycle-values speed 0.25 0.5 1 1.5 2 2; show-text "Speed: ${speed}x"
GAMEPAD_LEFT_STICK_DOWN  cycle-values speed 2 1.5 1 0.5 0.25 0.25; show-text "Speed: ${speed}x"
GAMEPAD_RIGHT_STICK     cycle-values video-scale-x 1 1.5 2 3 4 4; cycle-values video-scale-y 1 1.5 2 3 4 4; show-text "Zoom: ${video-scale-x}x"
GAMEPAD_LEFT_STICK      cycle-values video-scale-x 4 3 2 1.5 1 1; cycle-values video-scale-y 4 3 2 1.5 1 1; show-text "Zoom: ${video-scale-x}x"
# The right stick moves the zoomed picture; align keeps an edge of the video on the screen's edge
GAMEPAD_RIGHT_STICK_LEFT  no-osd add video-align-x -0.05
GAMEPAD_RIGHT_STICK_RIGHT no-osd add video-align-x 0.05
GAMEPAD_RIGHT_STICK_UP    no-osd add video-align-y -0.05
GAMEPAD_RIGHT_STICK_DOWN  no-osd add video-align-y 0.05
GAMEPAD_BACK            set speed 1; set video-scale-x 1; set video-scale-y 1; set video-align-x 0; set video-align-y 0; show-text "Speed: 1x   Zoom: 1x"
