# Luanti on the A33 (Mali-400 GLES2, 512 MB): copied once to ~/.minetest/minetest.conf by luanti.sh
video_driver = ogles2
fullscreen = true
screen_w = 640
screen_h = 480
autosave_screensize = false
fps_max = 30
fps_max_unfocused = 10
menu_last_game = minetest_game

# GPU: short view, no second render pass, no shadows or waving
viewing_range = 40
enable_post_processing = false
enable_dynamic_shadows = false
enable_3d_clouds = false
menu_clouds = false
enable_minimap = false
leaves_style = opaque
translucent_liquids = false
client_mesh_chunk = 2

# CPU and RAM: fewer active and loaded blocks
active_block_range = 2
max_block_send_distance = 4
max_block_generate_distance = 4
client_mapblock_limit = 1500
