# Luanti on the A33 (Mali-400 GLES2, 512 MB): copied once to ~/.minetest/minetest.conf by luanti.sh
video_driver = ogles2
fullscreen = true
screen_w = 640
screen_h = 480
autosave_screensize = false
fps_max = 30
fps_max_unfocused = 10
menu_last_game = minetest_game

# GPU: long view at 320x240 (narrower fov), no second render pass, no shadows or waving
viewing_range = 320
fov = 60
fog_start = 0.75
undersampling = 2
enable_post_processing = false
enable_dynamic_shadows = false
enable_3d_clouds = false
menu_clouds = false
enable_minimap = false
leaves_style = opaque
translucent_liquids = false
client_mesh_chunk = 1
# regions past 208 nodes (about 1 pixel per node) drawn from simplified meshes
client_lod_distance = 208

# CPU and RAM: few active blocks; blocks out of view expire after a minute, so memory follows what is seen
active_block_range = 2
max_block_send_distance = 20
max_block_generate_distance = 20
client_mapblock_limit = 2000
client_unload_unused_data_timeout = 30
client_unload_out_of_view = true

# Controls by position as on an Xbox pad (here B is at the bottom, A right, X top, Y left): R1 digs, L1 places,
# R2/L2 change slot, B jumps, A sneaks, X/Y open the inventory, L3 runs (goodluck_sprint), D-pad up camera, down drops
keymap_dig = MOUSE_BUTTON_1|GAMEPAD_BUTTON_10
keymap_place = MOUSE_BUTTON_3|GAMEPAD_BUTTON_9
keymap_hotbar_next = SYSTEM_SCANCODE_17|GAMEPAD_AXIS_PLUS_5
keymap_hotbar_previous = SYSTEM_SCANCODE_5|GAMEPAD_AXIS_PLUS_4
keymap_inventory = SYSTEM_SCANCODE_12|GAMEPAD_BUTTON_2|GAMEPAD_BUTTON_3
keymap_aux1 = SYSTEM_SCANCODE_8|GAMEPAD_BUTTON_7
keymap_camera_mode = SYSTEM_SCANCODE_6|GAMEPAD_BUTTON_11
keymap_zoom = SYSTEM_SCANCODE_29
goodluck_sprint_speed = 1.5

# Survival: stamina's hunger without its own sprint (L3 runs and drains it), at most 10 mobs active at once;
# hunger in the hearts' row on the right (goodluck_hud puts armor above the hearts and breath above hunger)
sprint = false
mob_active_limit = 10
stamina_hud_x = 25
stamina_hud_y = -88
