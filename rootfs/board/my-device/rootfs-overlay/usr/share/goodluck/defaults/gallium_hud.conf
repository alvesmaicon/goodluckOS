# Default Overlay and Date & Time settings, and the accent color of the volume / brightness
# feedback in games. ~/.config/gallium_hud.conf overrides them;
# System Settings -> System -> Restore default settings removes it.
HUD_STATUS_GAME=false
HUD_STATUS_LAUNCHER=true
HUD_STATUS_DATE=false
HUD_STATUS_TIME=true
HUD_STATUS_BATTERY=true
HUD_STATUS_AUDIO=true
HUD_STATUS_CPU_TEMP=false
HUD_STATUS_PMIC_TEMP=false
HUD_STATUS_OPACITY=50
HUD_VISIBLE=false
HUD_ITEMS=fps,cpu
HUD_STYLE=graph
HUD_POSITION=top-left
HUD_24H=false
HUD_DATE_FORMAT=%m/%d
HUD_ACCENT=ffcd3c
