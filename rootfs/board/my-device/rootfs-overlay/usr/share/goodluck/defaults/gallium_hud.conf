# Default Overlay and Date & Time settings. ~/.config/gallium_hud.conf overrides them;
# System Settings -> System -> Restore default settings removes it.
HUD_STATUS_CLOCK=false
HUD_STATUS_BATTERY=false
HUD_STATUS_AUDIO=false
HUD_STATUS_OPACITY=50
HUD_VISIBLE=false
HUD_ITEMS=fps,cpu
HUD_STYLE=graph
HUD_POSITION=top-left
HUD_DATE=true
HUD_TIME=true
HUD_24H=false
HUD_DATE_FORMAT=%m/%d
