# Puppy settings for running it on firmwares other than goodluckOS (goodluckOS needs no file: the
# defaults are its own layout). Puppy reads the file given with --config, else $PUPPY_CONFIG, else
# /etc/puppy.conf.
#
# One "key = value" per line; lines starting with # are comments. Relative paths are relative to this
# file and "~/" is the home folder. Lists are separated by ";". A key left empty clears the default.

# --- What to show -----------------------------------------------------------------------------------

# EmulationStation's systems: one tab per system with games, using its ROM folders, extensions and
# commands (for ES forks with an emulator/core choice, the default emulator and core). Missing files
# are skipped, so listing the usual places is fine.
es_systems = /etc/emulationstation/es_systems.cfg; ~/.emulationstation/es_systems.cfg

# apps.puppy files ([ENTRY]/[ARCHIVE] sections, see the goodluckOS README), and folders of *.puppy files
apps =
apps_dirs = apps

# --- Puppy's own files --------------------------------------------------------------------------------

font = assets/Inter_24pt-Medium.ttf
fallback_icon = assets/fallback.png
lang_dir = lang
config_dir = ~/.config/puppy
cache_dir = ~/.cache/puppy
autolaunch_file = ~/.config/puppy/autolaunch
# where Puppy leaves the picked command for puppy-run.sh (an empty launch_command: no goodluckOS appd)
launch_command =
launch_file = /dev/shm/puppy-launch
state_file = /dev/shm/puppy-state

# --- Options ------------------------------------------------------------------------------------------

# language = pt-BR
# view = list
# tabs = off

# --- Power options (POWER, or START when there's no settings_command) ---------------------------------

# Commands run in the background; actions without one are left out of the menu.
restart_command = sudo reboot
shutdown_command = sudo poweroff
screen_off_command =
# settings_command =
# System Settings in Puppy are goodluckOS's own
settings = off

# "Quit Puppy", back to the frontend Puppy was started from
quit = on

# a root daemon reading power requests (screen-off, reboot, poweroff) and the backlight; harmless when missing
# power_fifo = /run/power-request
# backlight = /sys/class/backlight/backlight/brightness
